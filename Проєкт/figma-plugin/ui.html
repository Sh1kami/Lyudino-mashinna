<!doctype html><meta charset="utf-8"><style>body{font:14px Arial;padding:18px;color:#173047}button,select{padding:12px;margin:8px 0;width:100%}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}button{background:#135b85;color:white;border:0;border-radius:8px}</style><h2>Лабораторні HCI · 19</h2><p>Панчишкін Богдан Олександрович · 3ПРс/3</p><select id="lab"><option value="4">ЛР4 · Lingua · Wireframes</option><option value="5">ЛР5 · MedTime · Hi-fi</option><option value="8">ЛР8 · MedTime · Accessibility</option></select><button id="generate">Створити макети</button><button id="export" disabled>Зберегти PNG та метадані</button><pre id="out">Створення нових сторінок. Існуючі макети не змінюються.</pre><script>generate.onclick=()=>{generate.disabled=true;parent.postMessage({pluginMessage:{type:'generate',lab:Number(lab.value)}},'*')};document.getElementById('export').onclick=()=>parent.postMessage({pluginMessage:{type:'export'}},'*');onmessage=event=>{const m=event.data.pluginMessage;if(m.type==='ready'){out.textContent=JSON.stringify(m,null,2);generate.disabled=false;document.getElementById('export').disabled=false;}if(m.type==='error'){out.textContent=m.error;generate.disabled=false;}if(m.type==='download'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(m.data)],{type:'application/json'}));a.download='figma-lab-'+m.data.lab+'.json';a.click();URL.revokeObjectURL(a.href);out.textContent='Експорт збережено: '+a.download;}}</script>
